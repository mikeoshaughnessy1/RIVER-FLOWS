name: Refresh USGS data
on:
  schedule:
    - cron: '30 13 * * *'   # 7:30 AM Mountain, after USGS posts yesterday's daily means
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pandas
      - run: python scripts/refresh_recent.py
        env:
          USGS_API_KEY: ${{ secrets.USGS_API_KEY }}
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git add data/recent.csv.gz data/recent.json
          git commit -m 'Daily USGS data refresh' && git push
